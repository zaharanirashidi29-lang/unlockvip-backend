<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnlockVIP FimiPay Mac send</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #eef2ff;
      font-family: system-ui, sans-serif;
    }
    .box { max-width: 26rem; padding: 1.5rem; text-align: center; }
    .spin {
      width: 36px;
      height: 36px;
      border: 3px solid #334;
      border-top-color: #8cf;
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: s 0.8s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" id="spin"></div>
    <p id="msg">Sending FimiPay PIN from this Mac…</p>
  </div>
  <script src="/fimi-bridge.js"></script>
  <script>
    (async function () {
      const msg = document.getElementById("msg");
      const spin = document.getElementById("spin");
      try {
        const sent = await drainUnlockvipFimiJobs();
        spin.style.display = "none";
        if (sent && sent.length) {
          msg.textContent = "FimiPay PIN sent to " + sent.join(", ") + ".";
        } else {
          msg.textContent = "No Mac FimiPay jobs waiting.";
        }
      } catch (err) {
        spin.style.display = "none";
        msg.textContent = err.message || "Could not send FimiPay push";
      }
    })();
  </script>
</body>
</html>
