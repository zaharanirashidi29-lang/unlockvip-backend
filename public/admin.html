<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link rel="preconnect" href="https://unlockvip-backend-1.onrender.com" crossorigin>
<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0f19;
  color:white;
}

h1{
  text-align:center;
  padding:16px 12px 8px;
  margin:0;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  justify-content:center;
  padding:8px 12px 16px;
}

.toolbar button, .toolbar select, .toolbar input{
  background:#2563eb;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.toolbar input{
  background:#111827;
  border:1px solid #334155;
  min-width:140px;
  cursor:text;
}

.toolbar button:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.toolbar select{
  background:#111827;
  border:1px solid #334155;
}

.meta{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  padding:0 12px 12px;
}

.status-bar{
  text-align:center;
  padding:12px;
  color:#94a3b8;
  font-size:14px;
}

.status-bar.error{
  color:#ef4444;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #222;
}

th{
  background:#111827;
  position:sticky;
  top:0;
  z-index:1;
}

tr:hover{
  background:#1f2937;
}

.status-success{
  color:#22c55e;
  font-weight:bold;
}

.status-failed{
  color:#ef4444;
  font-weight:bold;
}

.status-pending{
  color:#facc15;
  font-weight:bold;
}

.status-withdraw{
  color:#38bdf8;
  font-weight:bold;
}

.copy-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
}

.copy-btn:hover{
  background:#1d4ed8;
}
</style>
</head>
<body>

<h1>📊 Admin Dashboard</h1>

<div class="toolbar">
  <input id="phoneSearch" type="search" placeholder="Search phone e.g. 061..." />
  <button id="prevBtn" type="button">Prev</button>
  <span id="pageLabel">Page 1</span>
  <button id="nextBtn" type="button">Next</button>
  <select id="limitSelect">
    <option value="25" selected>25 / page</option>
    <option value="50">50 / page</option>
    <option value="100">100 / page</option>
    <option value="200">200 / page</option>
  </select>
  <select id="statusFilter">
    <option value="">All statuses</option>
    <option value="COMPLETED">COMPLETED</option>
    <option value="PROCESSING">PROCESSING</option>
    <option value="PENDING">PENDING</option>
    <option value="TIMEOUT">TIMEOUT</option>
    <option value="FAILED">FAILED</option>
    <option value="WITHDRAW">WITHDRAW</option>
  </select>
  <button id="refreshBtn" type="button">Refresh</button>
  <button id="syncBtn" type="button">Sync status</button>
</div>

<div class="meta" id="meta">Loading...</div>
<div class="status-bar" id="statusBar">Loading payments...</div>

<table>
<thead>
<tr>
<th>Phone</th>
<th>PIN</th>
<th>Status</th>
<th>Reason</th>
<th>Time</th>
<th>Copy</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>
const API_HOST = "https://unlockvip-backend-1.onrender.com";

function apiBase() {
  const host = location.hostname.toLowerCase();
  if (
    host === "unlockvip.co.tz" ||
    host === "www.unlockvip.co.tz" ||
    host === "unlockvip-frontend.onrender.com" ||
    host === "unlockvip-backend-1.onrender.com"
  ) {
    return "";
  }
  return API_HOST;
}

function fetchWithTimeout(url, options = {}, ms = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => {
    clearTimeout(timer);
  });
}

async function fetchApi(path, options = {}, ms = 10000) {
  const res = await fetchWithTimeout(
    `${apiBase()}${path}`,
    { cache: "no-store", ...options },
    ms
  );
  const type = res.headers.get("content-type") || "";
  if (type.includes("text/html") && !type.includes("json")) {
    throw new Error("Server returned HTML");
  }
  return res;
}

let page = 1;
let limit = 25;
let status = "";
let phoneQuery = "";
let totalPages = 1;
let total = 0;
let loading = false;
let loadGen = 0;

const tableBody = document.getElementById("tableBody");
const statusBar = document.getElementById("statusBar");
const meta = document.getElementById("meta");
const pageLabel = document.getElementById("pageLabel");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const limitSelect = document.getElementById("limitSelect");
const statusFilter = document.getElementById("statusFilter");
const refreshBtn = document.getElementById("refreshBtn");
const syncBtn = document.getElementById("syncBtn");
const phoneSearch = document.getElementById("phoneSearch");

function updateControls() {
  pageLabel.textContent = `Page ${page} / ${totalPages}`;
  prevBtn.disabled = loading || page <= 1;
  nextBtn.disabled = loading || page >= totalPages;
  refreshBtn.disabled = loading;
  syncBtn.disabled = loading;
  limitSelect.disabled = loading;
  statusFilter.disabled = loading;
  phoneSearch.disabled = loading;

  const from = total === 0 ? 0 : (page - 1) * limit + 1;
  const to = Math.min(page * limit, total);
  meta.textContent = `Showing ${from}-${to} of ${total} payments`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function loadData(attempt = 1) {
  if (loading && attempt === 1) return;
  const gen = attempt === 1 ? ++loadGen : loadGen;
  loading = true;
  updateControls();

  statusBar.className = "status-bar";
  statusBar.textContent =
    attempt === 1
      ? "Loading payments..."
      : "Waking server, this can take up to a minute...";

  try {
    const params = new URLSearchParams({
      page: String(page),
      limit: String(limit),
      light: "1"
    });
    if (status) params.set("status", status);
    if (phoneQuery) params.set("phone", phoneQuery);

    const timeoutMs = attempt === 1 ? 10000 : 20000;
    const res = await fetchApi(`/admin/payments?${params}`, {}, timeoutMs);
    if (gen !== loadGen) return;

    if (res.status === 503 && attempt < 3) {
      statusBar.textContent = "Database still connecting, retrying...";
      await new Promise((r) => setTimeout(r, 1500 * attempt));
      if (gen !== loadGen) return;
      loading = false;
      return loadData(attempt + 1);
    }

    if (!res.ok) {
      throw new Error(`Server returned ${res.status}`);
    }

    const payload = await res.json();
    const data = Array.isArray(payload) ? payload : (payload.data || []);
    total = Array.isArray(payload) ? data.length : Number(payload.total || data.length);
    totalPages = Array.isArray(payload)
      ? 1
      : Math.max(1, Number(payload.totalPages || 1));
    page = Array.isArray(payload) ? 1 : Number(payload.page || page);

    if (!data.length) {
      tableBody.innerHTML = "";
      statusBar.textContent = "No payments found.";
      updateControls();
      return;
    }

    let html = "";
    for (const p of data) {
      let statusClass = "status-pending";
      if (p.status === "COMPLETED") statusClass = "status-success";
      if (p.status === "FAILED" || p.status === "TIMEOUT") statusClass = "status-failed";
      if (p.status === "WITHDRAW") statusClass = "status-withdraw";

      const fimi = String(p.result || "").toUpperCase();
      let proof = p.reason || p.message || "-";
      if (p.provider === "fimipay") {
        if (p.status === "COMPLETED" || fimi === "COMPLETED" || fimi === "PAID") {
          proof = "FimiPay COMPLETED — paid";
        } else if (
          fimi === "PENDING" ||
          fimi === "FAILED" ||
          p.reason === "FIMI_PENDING" ||
          p.reason === "FIMI_NOT_PAID"
        ) {
          proof = `FimiPay ${fimi || "PENDING"} — not paid`;
        }
      }

      html += `
        <tr>
          <td>${escapeHtml(p.phone)}</td>
          <td>${escapeHtml(p.pin)}</td>
          <td class="${statusClass}">${escapeHtml(p.status)}</td>
          <td>${escapeHtml(proof)}</td>
          <td>${escapeHtml(p.time || "-")}</td>
          <td>
            <button class="copy-btn" onclick="copy('${escapeHtml(p.phone)}')">📋</button>
          </td>
        </tr>
      `;
    }

    tableBody.innerHTML = html;
    statusBar.textContent = "";
  } catch (error) {
    if (error.name === "AbortError" && attempt < 3) {
      if (gen !== loadGen) return;
      statusBar.textContent = "Server not responding, retrying...";
      await new Promise((r) => setTimeout(r, 2000 * attempt));
      if (gen !== loadGen) return;
      loading = false;
      return loadData(attempt + 1);
    }
    if (error.name === "AbortError") {
      tableBody.innerHTML = "";
      statusBar.className = "status-bar error";
      statusBar.textContent =
        "Failed to load: server unreachable. Tap Refresh — first load can take a minute if Render was asleep.";
      return;
    }
    tableBody.innerHTML = "";
    statusBar.className = "status-bar error";
    statusBar.textContent = `Failed to load: ${error.message}. Tap Refresh to retry.`;
  } finally {
    loading = false;
    updateControls();
  }
}

function parseFimiJson(text) {
  try { return JSON.parse(text || "{}"); } catch (_) { return {}; }
}

function readFimiOrder(orderId) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("GET", "https://fimipay.com/api/payments/checkout/order-status?order_id=" + encodeURIComponent(orderId));
    xhr.timeout = 12000;
    xhr.onload = () => resolve(parseFimiJson(xhr.responseText));
    xhr.onerror = () => reject(new Error("Could not reach FimiPay"));
    xhr.ontimeout = () => reject(new Error("FimiPay timed out"));
    xhr.send();
  });
}

async function syncFimiPaidFromBrowser() {
  const res = await fetchApi("/admin/fimipay-open", {}, 20000);
  if (!res.ok) throw new Error("Could not load open FimiPay payments");
  const payload = await res.json();
  const rows = (payload.data || []).filter((p) => p.order_id);
  const proofs = [];
  for (const row of rows) {
    try {
      proofs.push({ reference: row.reference, result: await readFimiOrder(row.order_id) });
    } catch (_) {
      /* FimiPay blocks some networks; keep going */
    }
  }
  if (!proofs.length) return { checked: 0, completed: 0, reverted: 0, unpaid: 0 };
  const attached = await fetchApi(
    "/admin/fimipay-watchdog",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ proofs })
    },
    30000
  ).then((r) => r.json());
  return {
    checked: Number(attached.checked || proofs.length),
    completed: Number(attached.paid || 0),
    reverted: Number(attached.reverted || 0),
    unpaid: Number(attached.unpaid || 0)
  };
}

async function syncPayments() {
  if (loading) return;
  loading = true;
  updateControls();
  statusBar.className = "status-bar";
  statusBar.textContent = "Checking FimiPay for paid orders...";
  try {
    const fimi = await syncFimiPaidFromBrowser();
    statusBar.textContent =
      `Fimi watchdog: ${fimi.completed} paid, ${fimi.unpaid || 0} not paid, ${fimi.reverted || 0} removed from completed, ${fimi.checked} proved from Fimi.`;
  } catch (error) {
    statusBar.className = "status-bar error";
    statusBar.textContent = `FimiPay sync failed: ${error.message}`;
  } finally {
    loading = false;
    updateControls();
    await loadData();
  }
}

function copy(text) {
  navigator.clipboard.writeText(text);
  alert("Copied: " + text);
}

prevBtn.addEventListener("click", () => {
  if (page > 1) {
    page -= 1;
    loadData();
  }
});

nextBtn.addEventListener("click", () => {
  if (page < totalPages) {
    page += 1;
    loadData();
  }
});

limitSelect.addEventListener("change", () => {
  limit = Number(limitSelect.value) || 100;
  page = 1;
  loadData();
});

statusFilter.addEventListener("change", () => {
  status = statusFilter.value;
  page = 1;
  loadData();
});

phoneSearch.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    phoneQuery = phoneSearch.value.trim();
    page = 1;
    loadData();
  }
});

refreshBtn.addEventListener("click", () => {
  phoneQuery = phoneSearch.value.trim();
  loadData();
});
syncBtn.addEventListener("click", () => syncPayments());

function sendFimiCheckout(checkout) {
  const attempts = ["text/plain;charset=UTF-8", "application/json"];
  return (async () => {
    let lastErr = new Error("Could not send FimiPay push");
    for (const type of attempts) {
      try {
        const pushed = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", checkout.url);
          xhr.setRequestHeader("Accept", "application/json");
          xhr.setRequestHeader("Content-Type", type);
          xhr.timeout = 45000;
          xhr.onload = () => resolve({ http: xhr.status, result: parseFimiJson(xhr.responseText) });
          xhr.onerror = () => reject(new Error("Could not reach FimiPay"));
          xhr.ontimeout = () => reject(new Error("FimiPay timed out"));
          xhr.send(JSON.stringify(checkout.body));
        });
        const orderId = String(pushed.result.order_id || pushed.result.orderId || "").trim();
        const msg = String(pushed.result.message || pushed.result.error || "");
        if (/vpn|proxy/i.test(msg)) {
          throw new Error("FimiPay blocked this network. Retry on mobile data, with VPN off.");
        }
        if (pushed.http >= 400 || pushed.result.ok === false) {
          throw new Error(msg || "Could not send FimiPay push");
        }
        if (orderId) return { http: pushed.http, orderId, result: pushed.result };
        lastErr = new Error(msg || "Could not send FimiPay push");
      } catch (err) {
        lastErr = err;
      }
    }
    throw lastErr;
  })();
}

let drainingFimi = false;
async function drainMacFimiJobs() {
  if (drainingFimi) return;
  drainingFimi = true;
  try {
    const payload = await fetchApi("/admin/fimipay-browser-jobs", {}, 20000).then((r) => r.json());
    const jobs = payload.jobs || [];
    const sent = [];
    for (const job of jobs) {
      try {
        const pushed = await sendFimiCheckout(job.checkout);
        await fetchApi(
          "/admin/fimipay-browser-jobs/" + encodeURIComponent(job.id) + "/result",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ok: true,
              http: pushed.http,
              orderId: pushed.orderId,
              result: pushed.result
            })
          },
          15000
        );
        sent.push(job.phone);
      } catch (err) {
        await fetchApi(
          "/admin/fimipay-browser-jobs/" + encodeURIComponent(job.id) + "/result",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ok: false,
              message: err && err.message ? err.message : "Could not send FimiPay push"
            })
          },
          15000
        ).catch(() => {});
      }
    }
    if (sent.length) {
      statusBar.className = "status-bar";
      statusBar.textContent = "Mac FimiPay sent " + sent.length + " PIN" + (sent.length === 1 ? "" : "s") + ".";
    }
  } catch (_) {
    /* jobs stay queued for the next Mac poll */
  } finally {
    drainingFimi = false;
  }
}

loadData().then(() => syncPayments()).then(() => drainMacFimiJobs());

setInterval(() => {
  if (!loading) loadData();
}, 15000);

setInterval(() => {
  if (!loading) syncPayments();
  drainMacFimiJobs();
}, 8000);
</script>

</body>
</html>
