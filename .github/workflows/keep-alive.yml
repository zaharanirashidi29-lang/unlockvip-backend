name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend and ping health
        run: |
          url="https://unlockvip-backend-1.onrender.com/health"
          for i in 1 2 3 4 5 6 7 8; do
            echo "attempt $i"
            if curl -fsS --max-time 90 "$url"; then
              echo
              exit 0
            fi
            sleep 12
          done
          exit 1
