<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paribet | Sports & Casino</title>
  <meta name="theme-color" content="#091a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paribet">
  <link rel="canonical" href="https://paribet.co.tz/">
  <link rel="manifest" href="/manifest.webmanifest" id="paribetManifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png" id="paribetAppleIcon">
  <script>
    window.PARIBET_BASE = location.pathname === "/paribet" || location.pathname.startsWith("/paribet/")
      ? "/paribet"
      : "";
    (function () {
      var base = window.PARIBET_BASE || "";
      var m = document.getElementById("paribetManifest");
      var a = document.getElementById("paribetAppleIcon");
      if (m) m.href = base + "/manifest.webmanifest";
      if (a) a.href = base + "/icons/icon-180.png";
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=34" id="paribetCss">
  <script>document.getElementById("paribetCss").href = (window.PARIBET_BASE || "") + "/styles.css?v=34";</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="logo" href="#/home">
        <span class="mark">P</span>
        <span class="word">PARI<span>BET</span></span>
      </a>
      <nav class="side-grid">
        <a href="#/live" data-route="live"><span>▶</span>Live</a>
        <a href="#/promo" data-route="promo"><span>★</span>Promo</a>
        <a href="#/slots" data-route="slots"><span>🎰</span>Slots</a>
        <a href="#/aviator" data-route="aviator"><span>✈</span>Aviator</a>
        <a href="#/sports" data-route="sports"><span>⚽</span>Sports</a>
        <a href="#/withdraw" data-route="withdraw"><span>↑</span>Withdraw</a>
        <a href="#/casino" data-route="casino"><span>♠</span>Casino</a>
        <a href="/download" id="getAppSide"><span>⬇</span>Get App</a>
      </nav>
      <p class="side-label">Favorites</p>
      <div id="favLinks" class="side-muted">Log in to pin matches</div>
      <p class="side-label">Sports</p>
      <div id="sportLinks"></div>
    </aside>

    <div class="main">
      <div class="head-sticky">
        <header class="topbar">
          <a class="logo compact" href="#/home" aria-label="Paribet home">
            <span class="word">Pari<span>bet</span></span>
          </a>
          <div class="auth-links" id="authLinks"></div>
          <button type="button" class="icon-btn menu-only" id="menuBtn" aria-label="Open menu">☰</button>
        </header>
        <nav class="subnav" id="subnav">
          <a href="#/home" data-route="home">Football</a>
          <a href="#/sports" data-route="sports">Upcoming</a>
          <a href="#/live" data-route="live">In-Play</a>
          <a href="#/sports" data-route="sports">All Sports</a>
          <a href="#/bets" data-route="bets">My Bets</a>
          <button type="button" class="sub-search" id="searchBtn" aria-label="Search">⌕</button>
        </nav>
      </div>
      <div id="view"></div>
    </div>

    <div id="betslipDock" hidden></div>
    <nav class="bottom">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/sports" data-route="sports">Sports</a>
      <a href="#/live" data-route="live">Live</a>
      <a href="#/bets" data-route="bets">My Bets</a>
      <button type="button" id="navSlip" data-route="betslip"><span class="nav-count" id="navSlipCount">0</span>Betslip</button>
    </nav>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="install-bar" id="installBar" hidden>
    <div>
      <b>Get the Paribet app</b>
      <span>Install on your phone or download the APK</span>
    </div>
    <a class="install-link" id="installBarLink" href="/download">Download</a>
    <button type="button" class="icon-btn" id="installBarClose" aria-label="Close">✕</button>
  </div>
  <script>
    (function () {
      var base = window.PARIBET_BASE || "";
      var side = document.getElementById("getAppSide");
      var barLink = document.getElementById("installBarLink");
      if (side) side.setAttribute("href", base + "/download");
      if (barLink) barLink.setAttribute("href", base + "/download");
      var s = document.createElement("script");
      s.src = base + "/app.js?v=65";
      document.body.appendChild(s);
      if ("serviceWorker" in navigator) {
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });
        navigator.serviceWorker.register(base + "/sw.js").then(function (reg) {
          reg.update();
        }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
